version: "3.9"

networks:
  ecommerce-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_secret
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-service:
    build:
      context: ./services
      dockerfile: product-service/Dockerfile
    container_name: product-service
    ports:
      - "5001:5001"
    environment:
      SERVICE_NAME: product-service
      PORT: "5001"
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  cart-service:
    build:
      context: ./services
      dockerfile: cart-service/Dockerfile
    container_name: cart-service
    ports:
      - "5002:5002"
    environment:
      SERVICE_NAME: cart-service
      PORT: "5002"
      REDIS_URL: redis://redis:6379/1
      PRODUCT_SERVICE_URL: http://product-service:5001
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - ecommerce-net

  order-service:
    build:
      context: ./services
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "5003:5003"
    environment:
      SERVICE_NAME: order-service
      PORT: "5003"
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@postgres:5432/ecommerce
      REDIS_URL: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  api-gateway:
    build:
      context: ./backend
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:5001
      CART_SERVICE_URL: http://cart-service:5002
      ORDER_SERVICE_URL: http://order-service:5003
    depends_on:
      - product-service
      - cart-service
      - order-service
    networks:
      - ecommerce-net

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - ecommerce-net

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - ecommerce-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - ecommerce-net

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - ecommerce-net
